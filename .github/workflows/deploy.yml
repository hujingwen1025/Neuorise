name: Deploy Exabyte Website App

on:
  push:
    branches: [ main ]
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo $(date)
            echo *=== GIT SITE PUBLISH START ===*
            cd /home/neuorisehost/Neuorise
            echo === RESETTING LOCAL CHANGES ===
            git reset --hard HEAD
            echo === RESET LOCAL CHANGES FINISHED ===
            echo === STARTING GIT PULL ===
            git pull https://github.com/hujingwen1025/Neuorise.git main
            echo === GIT PULL FINISHED ===
            echo === STARTING VENV ACTIVATION ===
            source venv/bin/activate
            echo === VENV ACTIVATION FINISHED ===
            echo === STARTING REQUIREMENTS INSTALLATION ===
            pip install -r requirements.txt
            echo === REQUIREMENTS INSTALLATION FINISHED ===
            echo === WRITING API KEYS TO .env ===
            touch .env
            if grep -q '^GEMINI_APIKEY=' .env; then
              sed -i 's|^GEMINI_APIKEY=.*|GEMINI_APIKEY=${{ secrets.GEMINI_APIKEY }}|' .env
            else
              echo "GEMINI_APIKEY=${{ secrets.GEMINI_APIKEY }}" >> .env
            fi
            if grep -q '^SUNO_APIKEY=' .env; then
              sed -i 's|^SUNO_APIKEY=.*|SUNO_APIKEY=${{ secrets.SUNO_APIKEY }}|' .env
            else
              echo "SUNO_APIKEY=${{ secrets.SUNO_APIKEY }}" >> .env
            fi
            if grep -q '^RESEND_APIKEY=' .env; then
              sed -i 's|^RESEND_APIKEY=.*|RESEND_APIKEY=${{ secrets.RESEND_APIKEY }}|' .env
            else
              echo "RESEND_APIKEY=${{ secrets.RESEND_APIKEY }}" >> .env
            fi
            if grep -q '^RESEND_SENDER_EMAIL=' .env; then
              sed -i 's|^RESEND_SENDER_EMAIL=.*|RESEND_SENDER_EMAIL=${{ secrets.RESEND_SENDER_EMAIL }}|' .env
            else
              echo "RESEND_SENDER_EMAIL=${{ secrets.RESEND_SENDER_EMAIL }}" >> .env
            fi
            if grep -q '^SITE_URL=' .env; then
              sed -i 's|^SITE_URL=.*|SITE_URL=${{ secrets.SITE_URL }}|' .env
            else
              echo "SITE_URL=${{ secrets.SITE_URL }}" >> .env
            fi
            echo === API KEYS WRITTEN TO .env ===
            echo === STARTING SYSTEMCTL RESTART ===
            sudo systemctl restart neuorise_server
            echo === SYSTEMCTL RESTART FINISHED ===
            echo *=== GIT SITE PUBLISH FINISHED ===*
            echo $(date)